[build]
  publish = "dist"
  command = "npm run build"
  edge_functions = "netlify/edge-functions"

# Social media crawler OG tag injection for /blog/:slug
[[edge_functions]]
  function = "social-meta"
  path = "/blog/*"

# ============================================================
# Headers — security, indexing, caching
# ============================================================

# Default headers applied to every response
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    X-Robots-Tag = "index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"

# llms.txt — indexable plain text, short cache
[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=300, s-maxage=300"
    X-Robots-Tag = "index, follow"

[[headers]]
  for = "/.well-known/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=300, s-maxage=300"
    X-Robots-Tag = "index, follow"

# robots.txt + sitemap — short cache so updates propagate fast
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=600"

# Hashed JS / CSS bundles — cache aggressively, immutable
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static images — long cache (paths in /img and root-level images)
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/imgs_blog/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# HTML — short cache so prerendered routes can update
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Sandbox / admin / dev pages — never index
[[headers]]
  for = "/testes-logo"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/blog-admin"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/debug-financeiro"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Custom form notifications
[forms.contact-form]
  template = "form-submission"

# Email para ti (notificação)
[[notifications]]
  type = "email"
  event = "form-submission"
  config.to = "jorgemopanc@icloud.com"
  config.subject = "📧 Novo {{ form.subject | title }} - Portfolio"

# Email automático para quem submete (confirmação)
