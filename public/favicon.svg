<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#141c26"/>
      <stop offset="100%" style="stop-color:#0c1118"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#77a7ff"/>
      <stop offset="100%" style="stop-color:#4a86e8"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Blue accent bar top -->
  <rect x="7" y="6" width="18" height="2.5" rx="1.25" fill="url(#accent)"/>

  <!-- JM monogram -->
  <text x="16" y="23.5"
        font-family="'Space Grotesk', -apple-system, system-ui, sans-serif"
        font-size="12.5"
        font-weight="700"
        text-anchor="middle"
        fill="#f3f6fb"
        letter-spacing="0.5">JM</text>
</svg>
