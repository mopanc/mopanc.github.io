<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradientes elegantes -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c3b091;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b7a5e;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdfbee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d2b48c;stop-opacity:1" />
    </linearGradient>

    <!-- Sombra sutil -->
    <filter id="text-shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="1" dy="1" stdDeviation="1" flood-color="#121212" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Fundo principal com gradiente -->
  <circle cx="16" cy="16" r="16" fill="url(#bg-gradient)" />

  <!-- Borda interna sutil -->
  <circle cx="16" cy="16" r="14" fill="none" stroke="#8b7a5e" stroke-width="0.5" opacity="0.3" />

  <!-- Overlay sutil para profundidade -->
  <circle cx="16" cy="16" r="13" fill="#121212" opacity="0.05" />

  <!-- Iniciais JM com gradiente e sombra -->
  <text x="16" y="21"
        font-family="'Space Grotesk', -apple-system, system-ui, sans-serif"
        font-size="12"
        font-weight="700"
        text-anchor="middle"
        fill="url(#text-gradient)"
        filter="url(#text-shadow)"
        letter-spacing="-0.5">JM</text>

  <!-- Ponto de destaque sutil -->
  <circle cx="16" cy="25" r="0.8" fill="#fdfbee" opacity="0.6" />
</svg>