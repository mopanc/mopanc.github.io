<!DOCTYPE html>
<html>
<head>
  <title>Contact Form - Hidden for Netlify</title>
</head>
<body>
  <!-- This file is used by Netlify to detect form fields. Do not delete. -->
  <form name="contact-form" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="name" />
    <input type="email" name="email" />
    <select name="subject">
      <option value="access_request">Portfolio Access Request</option>
      <option value="job_opportunity">Job Opportunity</option>
      <option value="project_discussion">Project Discussion</option>
      <option value="collaboration">Collaboration</option>
      <option value="other">Other</option>
    </select>
    <input type="text" name="company" />
    <input type="text" name="position" />
    <select name="reason">
      <option value="recruitment">Recruitment/Hiring</option>
      <option value="project_evaluation">Project Evaluation</option>
      <option value="partnership">Partnership Discussion</option>
      <option value="reference_check">Reference Check</option>
      <option value="other">Other</option>
    </select>
    <textarea name="message"></textarea>
  </form>
</body>
</html>
