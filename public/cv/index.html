<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jorge Mopanc - CV Terminal</title>
    <meta name="description" content="Jorge Mopanc's interactive terminal-style CV - A unique way to explore my professional experience">
    <meta name="author" content="Jorge Mopanc">
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
    <style>
        body {
            background-color: black; /* Fundo preto para simular terminal */
            color: #b8c5db; /* Cinza azulado, estilo Zsh */
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .terminal {
            width: 700px;
            max-width: 90%;
            border: 2px solid #b8c5db; /* Cor da borda com tom próximo ao texto */
            padding: 15px;
            overflow: hidden;
            border-radius: 5px;
        }

        .line {
            white-space: pre-wrap;
            margin: 5px 0;
        }

        .prompt {
            color: #6aed1d; /* Verde do Prompt do Terminal */
        }

        .command {
            color: #ffdd57; /* Amarelo para simular comandos */
        }

        .output {
            color: #b8c5db; /* Cinza azulado para saída dos comandos */
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background-color: #6aed1d; /* Cor verde piscando para o cursor */
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* Subtle enhancements maintaining terminal authenticity */
        .terminal {
            box-shadow: 0 0 20px rgba(106, 237, 29, 0.1);
            position: relative;
        }

        .terminal::before {
            content: "● ● ●";
            color: #ff5f57;
            position: absolute;
            top: -8px;
            left: 10px;
            font-size: 10px;
            letter-spacing: 3px;
        }

        /* Smooth typing effect */
        .line {
            opacity: 0;
            animation: fadeIn 0.3s ease-in forwards;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* Responsive improvements */
        @media (max-width: 768px) {
            .terminal {
                width: 95%;
                padding: 10px;
                font-size: 12px;
            }

            body {
                padding: 10px;
            }
        }
    </style>
</head>

    let index = 0;
    const terminal = document.getElementById('terminal');

    function typeLine() {
        if (index < lines.length) {
            const line = document.createElement('div');
            line.classList.add('line');
            line.innerHTML = lines[index];
            terminal.appendChild(line);

            // Add smooth fade-in animation
            setTimeout(() => {
                line.style.opacity = '1';
            }, 10);

            index++;

            // Variable typing speed for more realistic effect
            const delay = lines[index - 1].trim() === '' ? 50 : 150;
            setTimeout(typeLine, delay);
        } else {
            // Add final cursor
            const cursor = document.createElement('span');
            cursor.classList.add('cursor');
            terminal.appendChild(cursor);

            // Add keyboard event listener for interactivity
            document.addEventListener('keydown', handleKeyPress);
        }
    }

    // Add some basic keyboard interactivity
    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            const newLine = document.createElement('div');
            newLine.classList.add('line');
            newLine.innerHTML = '<span class="prompt">jorgemorais@macOS</span>:<span class="command">~</span>$ <span class="cursor"></span>';
            terminal.appendChild(newLine);
        }
    }
